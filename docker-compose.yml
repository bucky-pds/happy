services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3030:443"
    volumes:
      - ./bucky_configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - happy-server

  happy-server:
    image: happy-server:latest
    pull_policy: never
    restart: unless-stopped
    command: ["sh", "-c", "cd packages/happy-server && npx prisma migrate deploy && cd /repo && yarn --cwd packages/happy-server start"]
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HANDY_MASTER_SECRET=090a1b1bc783ad5676832643975afd061c5a38fb6d472e0dae7cb3ccdb15e33d

      # internal service DNS names (NOT localhost)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/happy-server
      - REDIS_URL=redis://redis:6379

      # MinIO / S3 settings required by sources/storage/files.ts
      - S3_HOST=minio
      - S3_PORT=9000
      - S3_USE_SSL=false
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=happy
      # public URL is what clients should use (keep internal-only unless you publish minio)
      - S3_PUBLIC_URL=http://minio:9000/happy
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully

  postgres:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=happy-server
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: docker.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Optional: publish these if you want to open the MinIO UI from your Mac
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"

  createbuckets:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/happy;
      mc anonymous set download myminio/happy;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
